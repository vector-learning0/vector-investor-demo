<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0d0f13">
  <title>Vector Learning — Investor Demo</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0d0f13;color:#fff;font-family:Arial,sans-serif}
    body{display:grid;place-items:center}
    .loading{opacity:.72;font-size:14px}
  </style>
</head>
<body>
  <p class="loading">Loading Vector Learning demo…</p>
  <script>
    (async () => {
      try {
        const response = await fetch('./vector_frontend_demo.html?v=3', { cache: 'no-store' });
        if (!response.ok) throw new Error('demo-load-failed');
        let html = await response.text();
        const inject = '<link rel="stylesheet" href="./investor-polish.css?v=3"><meta name="robots" content="noindex,nofollow">';
        html = html.replace('</head>', inject + '</head>');
        document.open();
        document.write(html);
        document.close();
        document.title = 'Vector Learning — Investor Demo';
      } catch (_) {
        window.location.replace('./vector_frontend_demo.html');
      }
    })();
  </script>
</body>
</html>
